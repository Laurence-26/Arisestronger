name: daily_quest
description: "AriseStronger — a Solo Leveling inspired daily fitness quest system."
publish_to: 'none'

version: 1.1.2+6

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local offline database (the app's own SQLite file — no cloud)
  sqflite: ^2.4.1
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Local notifications + scheduling
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^4.1.0

  # Local cache / preferences
  shared_preferences: ^2.3.2

  # Backup export / import (share a JSON file out, pick one back in)
  share_plus: ^11.0.0
  file_selector: ^1.0.3
  path_provider: ^2.1.5

  # Misc
  intl: ^0.19.0

  # Splash screen (runtime preserve/remove API + generator)
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#07070F"
  image: assets/icon/splash.png
  fullscreen: true
  android_12:
    color: "#07070F"
    image: assets/icon/splash.png

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "#07070F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
